<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; background: #000; }
    #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden;
             background: radial-gradient(circle at 50% 35%, #2a2a2a 0%, #0b0b0b 70%);
             font-family: "Montserrat", "Arial Black", sans-serif; color: #fff; }
    #bar { position: absolute; left: 90px; top: 820px; width: 0; height: 18px; background: {{ACCENT}}; border-radius: 9px; }
    #headline { position: absolute; left: 90px; right: 90px; top: 860px; font-size: 104px; line-height: 1.02;
                text-transform: uppercase; letter-spacing: -2px; }
    #sub { position: absolute; left: 90px; right: 90px; top: 1260px; font-size: 44px; opacity: .75; }
  </style>
</head>
<body>
  <div id="stage" data-composition-id="{{COMP_ID}}" data-start="0" data-width="1080" data-height="1920">
    <div id="bar" class="clip" data-start="0" data-duration="{{SECONDS}}" data-track-index="0"></div>
    <h1 id="headline" class="clip" data-start="0" data-duration="{{SECONDS}}" data-track-index="1">{{HEADLINE}}</h1>
    <p id="sub" class="clip" data-start="0" data-duration="{{SECONDS}}" data-track-index="2">{{SUB}}</p>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.to("#bar", { width: 260, duration: 0.35, ease: "power3.out" }, 0)
        .from("#headline", { y: 80, opacity: 0, duration: 0.45, ease: "back.out(1.6)" }, 0.08)
        .from("#sub", { opacity: 0, duration: 0.3 }, 0.3)
        .to("#stage", { opacity: 0, duration: 0.2 }, {{SECONDS}} - 0.2);
      window.__timelines = window.__timelines || {};
      window.__timelines["{{COMP_ID}}"] = tl;
    </script>
  </div>
</body>
</html>
